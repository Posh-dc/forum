<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/frontend/onboarding.css">
</head>

<body>


    <div class="main">

        <div class="switch">
            <!-- Switch between Register and login Slider div starts here  -->
            <div class="slider"></div>
            <button class="option active" type="button">Register</button>
            <button class="option" type="button">Login</button>
            <!-- Switch between Register and login Slider div ends here  -->
        </div>

        <p id="errorMessage"></p>
        <div class="registerDiv">
            <!-- Registration form  div starts here -->
            <form class="register">
                <div>
                    <label for=""><sup>*</sup>Display name</label>
                    <input type="text" id="displayName" placeholder="Enter your Display Name" name="displayName">
                </div>
                <div>
                    <label for=""><sup>*</sup>User name</label>
                    <input type="text" id="userName" placeholder="Enter your Username" name="userName">
                </div>
                <div>
                    <label for=""><sup>*</sup>Email</label>
                    <input type="email" id="email" placeholder="Enter your Email Address" name="emailAddress">
                </div>
                <div>
                    <label for=""><sup>*</sup>Password</label>
                    <input type="password" id="password"  placeholder="Enter your Password" name="password">
                </div>
                <div>
                    <label for=""><sup>*</sup>Phone number</label>
                    <input type="number"  id="phoneNumber" placeholder="Enter your phone number" name="phoneNumber">
                </div>
                <button type="submit">Create Account</button>
            </form>
            <!-- Registration form  div ends here -->
        </div>

        <div class="loginDiv">
            <!-- login form  div starts here -->
            <form class="login">
                <div>
                    <label for=""><sup>*</sup>Email</label>
                    <input type="email" placeholder="Enter your Email Address">
                </div>
                <div>
                    <label for=""><sup>*</sup>Password</label>
                    <input type="password" placeholder="Enter your Password">
                </div>

                <button type="submit">Login</button>
                <a href="">Forget Password ?</a>
            </form>
            <!-- login form  div starts here -->
        </div>

    </div>

    <script src="/frontend/onboarding.js"></script>
</body>

</html>
