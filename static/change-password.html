<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/frontend/change-password.css">
</head>

<body>


    <div class="main">

        <div class="header">
            <img class="mailIcon" src="/frontend/icons/email.png" alt="">
            <h2>CHANGE YOUR PASSWORD</h2>
        </div>
        <div class="note">
            <p id="errorMessage"></p>
            <h3>  This reset password link will expires in ... <strong id="countdown" data-expires-at="{{.ExpiresAt.UTC.Format "2006-01-02T15:04:05Z"}}">
                    --:--
                </strong> </h3>
        </div>
        <form id="forgetPassword">
            <div>
                <label for=""><sup>*</sup>Enter your New Password</label>
                <input type="password" id="password" placeholder="Enter your new password" name="password">


            </div>
            <button type="submit">Change password</button>
        </form>

        <a href="">← Back to verification page </a>
    </div>

    <script src="/frontend/change-password.js"></script>
</body>

</html>
