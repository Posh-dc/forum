<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/frontend/forget-password.css">
</head>

<body>


    <div class="main">

        <div class="header">
            <img class="mailIcon" src="/frontend/icons/email.png" alt="">
            <h2>CHANGE YOUR PASSWORD</h2>
        </div>

        <div class="note open">
            <h3>If an account exists for this email <br> <strong id="email"></strong> <br> A password reset link has been sent </h3> <br>
            <p>Please check your inbox or Spam and follow and click the link to reset your password. The
                link will
                expire in .. <strong id="countdown">
                   10min
                </strong> </p>
        </div>
        <div class="note close">
            <h3>Enter a new password below to change your password </h3> <br>
            <p id="errorMessage"></p>
            <!-- <p>Enter your new email address below. <br> We'll send a new verification code
                to this address.</p> -->
        </div>
        <form id="forgetPassword" class="close">
            <div>
                <label for=""><sup>*</sup>Enter your Email Address</label>
                <input type="email" id="email" placeholder="Enter your new  Address" name="emailAddress">
            </div>
            <button type="submit">Change password</button>
        </form>

        <a href="">← Back to verification page </a>



        <script src="/frontend/forget-password.js"></script>
</body>

</html>
